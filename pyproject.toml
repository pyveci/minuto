[project]
name = "minuto"
version = "0.0.0"
description = "Calculate on-call compensation based on OpsGenie API data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "pytz",
    "python-dateutil",
    "holidays",
    "matplotlib",
    "pydantic",
    "requests",
    "click",
    "python-dotenv",
    "email-validator",
    "icalendar",
    "xlsxwriter",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.5",
    "openpyxl",
]

[project.scripts]
minuto = "minuto.main:cli"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
venvPath = "."
venv = ".venv"
